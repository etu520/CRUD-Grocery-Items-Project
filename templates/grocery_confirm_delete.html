<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Grocery Item</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ06IQF16tQfFt3pRgQ3P1J+v+TIlYZz3UHLJ40UupVZaz4j6bF5e13riPP3" crossorigin="anonymous">

    <style>
        body {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .delete-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.5rem;
            color: #ff5e78;
            margin-bottom: 20px;
        }

        .btn-custom {
            background: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.2s;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-custom:hover {
            background: linear-gradient(90deg, #ff4e6a 0%, #ff7098 100%);
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: #ddd;
            color: #7B0D1E ;
            border-radius: 20px;
            padding: 10px;
            font-size: 1rem;
            text-decoration: none;
            display: block;
            transition: all 0.2s ease;

        }

        .btn-secondary:hover {
            background-color: #bbb;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="delete-container">
        <h1>Are you sure you want to delete "<strong>{{ item.name }}</strong>"?</h1>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-custom">Yes, Delete</button>
        </form>
        <div style="width: 400px">
            <a href="{% url 'grocery_list' %}" class="btn btn-secondary">Cancel</a>
        </div>

    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76A2iDvMq4kd/2zMJ3zp5eacj1BuWii6rRxJ9f9cUGFN4E8CWIwMGKxJB2wJ4Sk" crossorigin="anonymous"></script>

</body>
</html>
