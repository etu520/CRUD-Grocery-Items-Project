<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if item %}Edit{% else %}Create{% endif %} Grocery Item</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ06IQF16tQfFt3pRgQ3P1J+v+TIlYZz3UHLJ40UupVZaz4j6bF5e13riPP3" crossorigin="anonymous">

    <style>
        body {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            color: #ff5e78;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: bold;
            font-size: 18px;
            color: #DB7F8E;
        }

        .form-control {
            border-radius: 10px;
            color: #7B0D1E ;
            font-size: 14px;
            padding: 10px;
            width: 500px;
            margin-bottom: 15px;
            height: 50px;
            box-sizing: border-box;
        }

        .btn-custom {
            background: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.2s;
            width: 100%;
        }

        .btn-custom:hover {
            background: linear-gradient(90deg, #ff4e6a 0%, #ff7098 100%);
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: #ccc;
            color: #7B0D1E ;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            display: block;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: #bbb;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>{% if item %}Edit{% else %}Create{% endif %} Grocery Item</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ item.name|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label for="quantity" class="form-label">Quantity:</label>
                <input type="number" id="quantity" name="quantity" class="form-control" value="{{ item.quantity|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Price:</label>
                <input type="number" id="price" name="price" step="0.01" class="form-control" value="{{ item.price|default:'' }}" required>
            </div>
            <button type="submit" class="btn btn-custom">Save</button>
        </form>
        <a href="{% url 'grocery_list' %}" class="btn btn-secondary">Cancel</a>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76A2iDvMq4kd/2zMJ3zp5eacj1BuWii6rRxJ9f9cUGFN4E8CWIwMGKxJB2wJ4Sk" crossorigin="anonymous"></script>

</body>
</html>
